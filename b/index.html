<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOTTU — Garder cette visite</title>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f2ea;
  --ink:#0e0b0a;
  --orange:#a05f00;
  --peach:#ffe5c0;
  --mid:#6b5d54;
  --line:#e0d6c8;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:'Helvetica Neue',Helvetica,Arial,system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
main{
  max-width:420px;
  margin:0 auto;
  padding:28px 22px 48px;
}
.logo{height:28px;width:auto}
h1{
  font-family:'Fredoka',Helvetica,Arial,sans-serif;
  font-weight:600;
  font-size:2rem;
  line-height:1.1;
  letter-spacing:-.02em;
  margin:28px 0 10px;
}
p{margin:0;color:var(--mid);line-height:1.5}
.card{
  margin-top:22px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input[type="email"],input[type="password"],input[type="text"]{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 14px;
  font:inherit;
  font-size:16px;
  background:#fff;
}
button,.store{
  display:block;
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:14px;
  min-height:48px;
  padding:12px 16px;
  font:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  text-align:center;
  text-decoration:none;
}
.primary{background:var(--ink);color:var(--paper)}
.secondary{background:var(--peach);color:var(--ink)}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;color:var(--mid)}
.check input{margin-top:3px}
.alert{margin-top:14px;color:#8a5200;font-weight:600}
.ok{margin-top:14px;font-weight:600;color:var(--ink)}
.hidden{display:none}
a.inline{color:var(--orange)}
.app-link{display:inline-block;margin-top:18px;color:var(--mid);font-size:14px}
</style>
</head>
<body>
<main>
  <img class="logo" src="../img/logo-lockup-dark.png" alt="GOTTU">
  <h1 id="title">Un instant…</h1>
  <p id="lead"></p>
  <div id="panel" class="card hidden"></div>
  <a id="open-app" class="app-link hidden" href="#">J'ai déjà l'app</a>
</main>
<script src="./config.js"></script>
<script type="module" src="./claim.js"></script>
</body>
</html>
