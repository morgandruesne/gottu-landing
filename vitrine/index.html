<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOTTU</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f2ea;color:#0e0b0a;font-family:Helvetica,Arial,sans-serif}
  a{color:#a05f00}
</style>
<script>
  // Destination du QR https://gottu.io/vitrine/
  // Changer ces trois adresses pour viser l'App Store, le Play Store ou autre.
  // Un profil Instagram s'ouvre dans l'app sur téléphone.
  var IOS = "https://instagram.com/gottu.cafe";
  var ANDROID = "https://instagram.com/gottu.cafe";
  var DEFAULT = "https://instagram.com/gottu.cafe";
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  var url = isIOS ? IOS : isAndroid ? ANDROID : DEFAULT;

  function instagramUsername(target) {
    var match = String(target).match(/instagram\.com\/([A-Za-z0-9._]+)/i);
    if (!match) return "";
    if (/^(p|reel|reels|stories|explore)$/i.test(match[1])) return "";
    return match[1];
  }

  function openTarget(target) {
    var username = instagramUsername(target);
    if (username && isAndroid) {
      location.href = "intent://www.instagram.com/" + username + "/#Intent;package=com.instagram.android;scheme=https;S.browser_fallback_url=" + encodeURIComponent(target) + ";end";
      return;
    }
    if (username && isIOS) {
      var timer = setTimeout(function () {
        if (!document.hidden) location.replace(target);
      }, 1200);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) clearTimeout(timer);
      });
      location.href = "instagram://user?username=" + username;
      return;
    }
    location.replace(target);
  }

  document.addEventListener("DOMContentLoaded", function () {
    var link = document.getElementById("go");
    if (!link) return;
    var username = instagramUsername(url);
    link.href = username && (isIOS || isAndroid) ? "instagram://user?username=" + username : url;
  });
  openTarget(url);
</script>
</head>
<body>
  <p><a id="go" href="https://instagram.com/gottu.cafe">Ouvrir Instagram</a></p>
</body>
</html>
